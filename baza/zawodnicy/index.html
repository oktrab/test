<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Edytor bazy zawodników</title>
  <link rel="preload"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap"
        as="style" onload="this.rel='stylesheet'">
  <link rel="stylesheet" href="../styles.css?v=4">
</head>
<body>

<main class="app">
  <section class="panel">

    <nav class="row nav">
      <a href="../../index.html" class="btn secondary">🏠 Strona główna</a>
      <a href="../../liga/index.html" class="btn secondary">Generator Tabeli</a>
      <a href="../../strzelcy/index.html" class="btn secondary">Król Strzelców</a>
      <a href="../index.html" class="btn">Baza Danych</a>
    </nav>

    <h1>Edytor bazy zawodników</h1>

    <div class="switcher">
      <a href="../kluby/index.html"
         class="switch-btn to-clubs"
         id="swToClubs">
        Edytor klubów →
      </a>
    </div>

    <!-- Prosty edytor -->
    <details class="sec" open>
      <summary>Prosty edytor (formularz)</summary>
      <div class="toolbar">
        <button id="btnFormAddPlayer" class="btn secondary">+ Dodaj zawodnika</button>
        <button id="btnFormToPlayers" class="btn">Formularz → JSON</button>
        <!-- ✅ NOWE PRZYCISKI -->
        <button id="btnFormSavePlayers" class="btn">Zapisz bazę (24h)</button>
        <button id="btnFormApplyPlayers" class="btn secondary">Zastosuj do Strzelców</button>
        <button id="btnFormDownloadPlayers" class="btn secondary">Pobierz JSON</button>
        <span class="status" id="statusPlayersForm">Gotowe.</span>
      </div>
      <datalist id="clubsDatalist"></datalist>
      <div id="playersForm"></div>
    </details>

    <!-- Zaawansowany edytor -->
    <details class="sec">
      <summary>Zaawansowany (JSON)</summary>

      <div class="editor">
        <textarea id="taPlayers"
                  class="textarea"
                  spellcheck="false"
                  placeholder='[{"name":"Jan Kowalski","goals":12,"club":"...","cc":"SZ"}]'
        ></textarea>

        <div class="toolbar">
          <input id="filePlayers" type="file" accept=".json" hidden>
          <button id="btnLoadPlayersFile" class="btn secondary">Wczytaj z pliku</button>
          <button id="btnFormatPlayers"   class="btn secondary">Sformatuj JSON</button>
          <button id="btnSavePlayers"     class="btn">Zapisz jako bazę (24h)</button>
          <button id="btnApplyPlayers"    class="btn secondary">Zastosuj do Strzelców</button>
          <button id="btnDownloadPlayers" class="btn">Pobierz JSON</button>
          <button id="btnClearPlayers"    class="btn secondary">Wyczyść lokalną bazę</button>
          <button id="btnFormFromPlayers" class="btn secondary">Z JSON → Formularz</button>
        </div>

        <div id="statusPlayers" class="status">Gotowe.</div>
      </div>
    </details>

  </section>
</main>

<footer class="site-footer">powered by OKB</footer>
<script src="app.js?v=9"></script>
</body>
</html>
